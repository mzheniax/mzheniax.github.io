<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель: Модуль «Товари» (Варіант 10)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Адміністративна панель: Модуль «Товари»</h1>
      <p class="subtitle">
        Варіант 10: ID, Name, Description, Price, Date Added, Sklad (1/0) | Сортування: ID, Sklad
      </p>
    </div>

    <!-- Перемикач для відтворення дефекту та його виправлення -->
    <div class="bug-toggle-box">
      <input type="checkbox" id="bugModeToggle" checked>
      <label for="bugModeToggle">
        🐞 Режим багу сортування (текстове сортування ID)
      </label>
    </div>
  </header>

  <!-- Форма додавання та редагування товару -->
  <section class="card">
    <h2 id="formTitle">Додати новий товар</h2>
    <form id="productForm">
      <input type="hidden" id="editOriginalId" value="">
      
      <div class="form-grid">
        <div class="form-group">
          <label for="productId">ID товару *</label>
          <input type="number" id="productId" placeholder="Наприклад: 10">
          <span class="error-msg" id="idError"></span>
        </div>

        <div class="form-group">
          <label for="productName">Назва (Name) *</label>
          <input type="text" id="productName" placeholder="Наприклад: Монітор Dell">
          <span class="error-msg" id="nameError"></span>
        </div>

        <div class="form-group">
          <label for="productPrice">Ціна (Price, ₴) *</label>
          <input type="number" id="productPrice" step="0.01" placeholder="Наприклад: 4999.00">
          <span class="error-msg" id="priceError"></span>
        </div>

        <div class="form-group">
          <label for="productDate">Дата додавання (Date Added) *</label>
          <input type="date" id="productDate">
          <span class="error-msg" id="dateError"></span>
        </div>

        <div class="form-group">
          <label for="productSklad">Наявність на складі (Sklad) *</label>
          <select id="productSklad">
            <option value="1">1 — В наявності</option>
            <option value="0">0 — Відсутній</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="productDesc">Опис (Description)</label>
          <textarea id="productDesc" rows="2" placeholder="Короткий опис характеристик товару..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveBtn">Зберегти товар</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Скасувати</button>
      </div>
    </form>
  </section>

  <!-- Таблиця списку товарів -->
  <section class="card">
    <div class="table-header">
      <h2>Список товарів</h2>
      <span class="hint-text">
        Клікніть на заголовок <b>ID</b> або <b>Sklad</b> для сортування
      </span>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th class="sortable" id="thId">ID <span id="sortIconId">↕</span></th>
            <th>Назва</th>
            <th>Опис</th>
            <th>Ціна (₴)</th>
            <th>Дата додавання</th>
            <th class="sortable" id="thSklad">Sklad (1/0) <span id="sortIconSklad">↕</span></th>
            <th class="col-actions">Дії</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <!-- Рядки генеруються через script.js -->
        </tbody>
      </table>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
